# Public-data v0.1 defaults. JSON with the same fields can be passed directly
# to scripts/train_joint.py; YAML is the human-readable authoritative config.
enabled: true
seed: 42
epochs: 10
batch_size: 4
gradient_accumulation: 4
head_learning_rate: 0.0001
encoder_learning_rate: 0.00001
weight_decay: 0.01
gradient_clip: 1.0
device: cuda
maximum_cost_gbp: 95.0
gpu_hour_cost_gbp: 0.36
early_stopping_patience: 3
adaptation_candidates: [frozen, upper_two]
