notes:
  - FSD50K curation and annotations are CC BY 4.0, while each Freesound clip retains its own licence.
  - Selection reads the official metadata and ground-truth archives before constructing any clip audio URL.
  - Only clip-level CC0 and CC BY entries are eligible; NC and Sampling+ entries fail closed.
  - Individual selected WAV files are fetched from a pinned mirror and converted to mono 16 kHz PCM16 under gitignored data/raw/.
  - Shout is a standalone Freesound event, not speech-embedded shouting.
  - Crying_and_sobbing maps to sob, not crying_speech without evidence of speech with crying.
  - Screaming remains separate and is not relabelled as shouting.
  - This is operational research guidance, not legal advice or lawyer sign-off.
