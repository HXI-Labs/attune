notes:
  - The official record contains 7,000 Bangla utterances from 20 actors, ten sentences, seven intended emotions, and five takes.
  - Actor-disjoint, gender-stratified 14/2/4 train/development/sealed partitions are mandatory.
  - Bangla text is not supplied in the audio archive, so SUBESCO must never supervise Attune ASR.
  - Source filename F_02_MONIKA_S_2_SURPRISE_3].wav has one pinned stray bracket and is canonicalized only after archive verification.
  - Intended angry delivery is an affect label and must never be relabelled as shouting.
  - Citation and attribution are required in downstream dataset and model cards.
