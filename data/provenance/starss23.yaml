constraints:
  - Use development audio with labels; never use unlabelled evaluation audio for this experiment.
  - Commit only manifests, hashes, provenance, code, and aggregate metrics.
  - Never commit audio, embeddings, model weights, or trained checkpoints.
  - Keep the scientific gold gate closed; STARSS23 labels are not Attune gold.
