language:
  status: unverified
  note: >-
    STARSS23 metadata has no language field and the dataset README states that
    speech spans several languages. No English filter or claim is made.
privacy_consent:
  status: bounded_research_caveat
  note: >-
    These are natural recordings involving participants. The dataset reports
    participant consent for synchronized video and face blurring, but this
    project has not independently verified individual consent records. Audio is
    used only in a bounded local research slice and is never committed.
attribution: >-
