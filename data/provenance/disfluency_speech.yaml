notes:
  - The corpus is a new studio recording by one consenting speaker; its text prompts were adapted from Switchboard annotations.
  - Official train, validation, and test clips share the same speaker, so they are clip-disjoint rather than speaker-disjoint.
  - Attune uses the corpus for weak event training only and retains WESR-Bench as independent external evaluation.
