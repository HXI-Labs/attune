notes:
  - Acted recordings provide shared sentences across emotion and intensity and are candidates for polarity-delivery conflict inspection.
  - Do not redistribute original audio where doing so would conflict with the ODbL or applicable produced-work rules; keep audio local and off git.
  - Do not download in CI.
  - Selected-file hashes, pinned source revision, attribution, and speaker-disjoint partitions are recorded in data/manifests/.
  - The licence-clean expansion adds source-labelled ANG, FEA, and DIS from actors absent from the original 70-clip set.
  - CREMA-D has no surprise source category; none is inferred.
  - Source intensity is retained as metadata and must not be mapped to shouting, whispering, or vocal effort.
  - The expansion manifest is data/manifests/licence-clean-inspection.jsonl.
  - This is an operational internal-research review, not legal advice or lawyer sign-off.
