notes:
  - The official actor-disjoint train, validation, and test splits map to Attune train, development, and sealed_test without repartitioning.
  - Affect labels are actor prompts and have not been validated by listeners. They are weak intended-delivery targets, not verified perceived affect.
  - Source shout/no-shout labels supervise only the shouting style. Three n/a intensity rows remain style-unsupervised.
  - Nonsense phrases and paired intensity takes help test acoustic reliance without emotionally suggestive text.
  - Phone model, placement, obstruction, home acoustics, and accent variation make the corpus useful for device and loudness-shortcut evaluation.
  - Citation and attribution are required in downstream dataset and model cards.
  - Keep local audio and prepared features outside Git.
